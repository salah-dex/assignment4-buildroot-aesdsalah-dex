name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
  full-test:
    container: cuaesd/aesd-autotest:24-assignment4-buildroot
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v2

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Configure Git HTTPS auth
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup persistent cache
        run: |
          mkdir -p /home/sedex/.buildroot-cache/output
          mkdir -p /home/sedex/.buildroot-cache/ccache
          ln -sfn /home/sedex/.buildroot-cache/output $GITHUB_WORKSPACE/buildroot/output
          if [ -f /home/sedex/.buildroot-cache/buildroot.config ]; then
            cp /home/sedex/.buildroot-cache/buildroot.config $GITHUB_WORKSPACE/buildroot/.config
          fi

      - name: Run full test
        run: ./full-test.sh
